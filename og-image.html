<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }
  body {
    background: #fafaf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
    position: relative;
  }
  .line {
    position: absolute;
    left: 60px;
    right: 60px;
    height: 1px;
    background: #e0e0e0;
  }
  .line-top    { top: 190px; }
  .line-bottom { bottom: 190px; }
  .title {
    font-size: 112px;
    font-weight: 800;
    color: #000;
    letter-spacing: -3px;
    line-height: 1;
    margin-bottom: 18px;
  }
  .url {
    font-size: 17px;
    color: #8a6dba;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    letter-spacing: 0.15em;
    text-transform: lowercase;
  }
</style>
</head>
<body>
  <div class="line line-top"></div>
  <div class="title">PMAYR</div>
  <div class="url">pmayr.xyz</div>
  <div class="line line-bottom"></div>
</body>
</html>
