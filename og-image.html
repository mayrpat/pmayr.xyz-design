<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #fafaf8;
  }
  body {
    position: relative;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .header {
    position: absolute;
    top: 52px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 22px;
    border-bottom: 1px solid #e0e0e0;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    color: #000;
    letter-spacing: -0.5px;
  }
  .date {
    font-size: 15px;
    color: #8a6dba;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }
  /* Title is centered to the full 1200x630 canvas */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
  }
  /* Reduce font-size for longer titles, e.g. 56px */
  .title {
    font-size: 72px;
    font-weight: 700;
    color: #000;
    text-align: center;
    line-height: 1.2;
    letter-spacing: -2px;
    max-width: 960px;
  }
  .footer {
    position: absolute;
    bottom: 52px;
    left: 64px;
    right: 64px;
    border-top: 1px solid #e0e0e0;
    padding-top: 20px;
    font-size: 14px;
    color: #8a6dba;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">PMAYR</div>
    <div class="date">10 Jul 2026</div> <!-- EDIT DATE -->
  </div>
  <div class="content">
    <div class="title">Investing in tennis players</div> <!-- EDIT TITLE -->
  </div>
  <div class="footer">pmayr.xyz</div>
</body>
</html>
